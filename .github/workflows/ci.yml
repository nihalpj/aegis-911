name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint / Typecheck / Build / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Requires a committed root package-lock.json (generated by the first
      # workspace install). `--if-present` keeps every step green while the
      # app workspaces are still being scaffolded.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Build
        run: npm run build --workspaces --if-present

      - name: Test
        run: npm run test --workspaces --if-present

  infra-config:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file (infra-only, no app profile)
        run: docker compose -f infra/docker-compose.yml config -q

      - name: Validate compose file (with app profile active)
        run: docker compose -f infra/docker-compose.yml --profile app config -q
