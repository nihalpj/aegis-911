# AEGIS-911 local development infrastructure.
#
# Infra services (postgres, redis, minio, minio-init) come up on their own:
#   docker compose -f infra/docker-compose.yml up -d
#
# The `app` profile additionally builds/runs apps/server + apps/web from their
# Dockerfiles (repo root is the build context). `npm run infra:up` enables the
# profile automatically once both Dockerfiles exist:
#   docker compose -f infra/docker-compose.yml --profile app up -d
#
# Overrides are read from infra/.env (see infra/.env.example); every variable
# has a dev-safe default so the stack works out of the box.

name: aegis911

services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis911-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aegis911}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Idempotent init, applied only on first volume creation.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis911}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: aegis911-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--requirepass", "${REDIS_PASSWORD:-aegis_dev_password}",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-aegis_dev_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: aegis911-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aegis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aegis_dev_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"    # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot bucket bootstrap: creates the recordings bucket if missing.
  minio-init:
    image: minio/mc:latest
    container_name: aegis911-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-aegis} ${MINIO_ROOT_PASSWORD:-aegis_dev_password} &&
      mc mb --ignore-existing local/${S3_BUCKET:-aegis-recordings} &&
      echo 'MinIO bucket ready: ${S3_BUCKET:-aegis-recordings}'
      "
    restart: "no"

  # ---- Optional application tier (`--profile app`) -------------------------
  # Built from the workspaces' Dockerfiles with the REPO ROOT as build
  # context, so Dockerfiles can COPY shared packages/ (npm workspaces).

  server:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    container_name: aegis911-server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: ${SERVER_PORT:-4000}
      DATABASE_URL: postgres://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:-aegis_dev_password}@postgres:5432/${POSTGRES_DB:-aegis911}
      REDIS_URL: redis://:${REDIS_PASSWORD:-aegis_dev_password}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-aegis-recordings}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-aegis}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-aegis_dev_password}
      MOCK_VENDORS: ${MOCK_VENDORS:-true}
      KMS_MASTER_KEY: ${KMS_MASTER_KEY:-}
    ports:
      - "${SERVER_PORT:-4000}:${SERVER_PORT:-4000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:'+(process.env.PORT||4000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: aegis911-web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:${SERVER_PORT:-4000}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  minio-data:
